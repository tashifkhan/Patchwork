name: Publish F-Droid Repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag containing the APK, for example v1.0.0'
        required: true
        type: string
      apk_pattern:
        description: 'APK asset pattern in the release'
        required: true
        default: '*.apk'
        type: string

permissions:
  contents: read

jobs:
  trigger-website-fdroid:
    name: Trigger tashif.codes F-Droid publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      APK_PATTERN: ${{ github.event_name == 'workflow_dispatch' && inputs.apk_pattern || '*.apk' }}
      GH_TOKEN: ${{ secrets.TASHIF_CODES_WORKFLOW_TOKEN }}
    steps:
      - name: Validate token
        run: test -n "$GH_TOKEN"

      - name: Trigger tashif.codes workflow
        run: |
          gh workflow run publish-fdroid.yml \
            --repo tashifkhan/tashif.codes \
            --field source_repository="${{ github.repository }}" \
            --field release_tag="$RELEASE_TAG" \
            --field apk_pattern="$APK_PATTERN"
