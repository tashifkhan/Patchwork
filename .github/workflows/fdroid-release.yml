name: Publish F-Droid Repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag containing the APK, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-fdroid-repo:
    name: Publish APK to F-Droid-compatible repo
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fdroid-input
          gh release download "$RELEASE_TAG" --pattern '*.apk' --dir fdroid-input
          test -n "$(ls fdroid-input/*.apk 2>/dev/null)"

      - name: Publish to F-Droid repo branch
        uses: pacien/f-droid-repo-action@v1
        with:
          repository: ${{ github.repository }}
          branch: fdroid
          token: ${{ secrets.FDROID_REPO_TOKEN || github.token }}
          apk: fdroid-input/*.apk
