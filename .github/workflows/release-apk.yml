name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate project
        run: |
          bun x expo-doctor
          bun run lint

      - name: Build APK on EAS
        run: bun x eas-cli build --platform android --profile github-release --non-interactive --wait

      - name: Download latest APK
        id: download_apk
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK_PATH="PatchWork-${VERSION}.apk"
          bun x eas-cli build:download --platform android --profile github-release --latest --output "$APK_PATH"
          echo "apk_path=app/$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PatchWork ${{ env.RELEASE_TAG }}
          files: ${{ steps.download_apk.outputs.apk_path }}
          generate_release_notes: true
